<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Builder Ultimate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { primary: '#6366f1' } } }
    }
  </script>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-white min-h-screen pb-32">

  <header class="bg-white dark:bg-slate-800 shadow-sm border-b border-gray-200 dark:border-slate-700 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold text-indigo-600">🚀 PWA Ultimate</h1>
      <button onclick="toggleTheme()" class="p-2">🌙</button>
    </div>
  </header>

  <!-- Progress Bar -->
  <div class="max-w-2xl mx-auto px-4 pt-4">
    <div class="flex justify-between mb-2 text-xs">
      <span id="step1-indicator" class="text-indigo-600 font-bold">1. URL</span>
      <span id="step2-indicator">2. Desain</span>
      <span id="step3-indicator">3. Lanjutan</span>
      <span id="step4-indicator">4. Export</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-2">
      <div id="progressBar" class="bg-indigo-600 h-2 rounded-full" style="width: 25%"></div>
    </div>
  </div>

  <main class="max-w-2xl mx-auto px-4 py-6">
    
    <!-- STEP 1 -->
    <section id="step1" class="wizard-step bg-white dark:bg-slate-800 rounded-2xl p-6 shadow mb-6">
      <h2 class="text-xl font-bold mb-4">🔗 Masukkan URL Website</h2>
      <div class="flex gap-2 mb-3">
        <input id="urlInput" type="url" placeholder="https://example.com" class="flex-1 px-4 py-3 bg-gray-100 dark:bg-slate-700 rounded-lg">
        <button onclick="analyzeUrl()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold">Cek</button>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="wizard-step hidden bg-white dark:bg-slate-800 rounded-2xl p-6 shadow mb-6">
      <h2 class="text-xl font-bold mb-4"> Desain</h2>
      <input id="titleInput" placeholder="Nama Aplikasi" class="w-full mb-3 px-4 py-2 bg-gray-100 dark:bg-slate-700 rounded-lg">
      <input type="file" id="iconUpload" accept="image/*" class="w-full mb-3" onchange="handleIconUpload(event)">
      <input type="hidden" id="iconInput">
      <div class="grid grid-cols-2 gap-3">
        <input id="colorInput" type="color" class="h-12 rounded" oninput="updateMockup()">
        <input id="bgInput" type="color" class="h-12 rounded" oninput="updateMockup()">
      </div>
    </section>

    <!-- STEP 3 -->
    <section id="step3" class="wizard-step hidden bg-white dark:bg-slate-800 rounded-2xl p-6 shadow mb-6">
      <h2 class="text-xl font-bold mb-4">⚙️ Fitur Lanjutan</h2>
      <select id="displayInput" class="w-full px-4 py-2 bg-gray-100 dark:bg-slate-700 rounded-lg mb-3">
        <option value="standalone">Standalone</option>
        <option value="fullscreen">Fullscreen</option>
      </select>
      <label class="flex items-center gap-2 mb-3">
        <input type="checkbox" id="enableShortcuts" onchange="toggleShortcuts()">
        App Shortcuts
      </label>
      <div id="shortcutsContainer" class="hidden">
        <input id="shortcutName1" placeholder="Nama Shortcut" class="w-full mb-2 px-3 py-2 bg-gray-100 dark:bg-slate-700 rounded">
        <input id="shortcutUrl1" placeholder="URL" class="w-full px-3 py-2 bg-gray-100 dark:bg-slate-700 rounded">
      </div>
    </section>

    <!-- STEP 4 -->
    <section id="step4" class="wizard-step hidden bg-white dark:bg-slate-800 rounded-2xl p-6 shadow mb-6">
      <h2 class="text-xl font-bold mb-4"> Export & Download</h2>
      
      <div class="bg-green-50 dark:bg-green-900/30 p-4 rounded-xl mb-4 text-sm">
        ✅ PWA Anda siap!
      </div>

      <button onclick="generateUltimateZip()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mb-3">
        📦 Download Paket PWA (ZIP)
      </button>

      <button onclick="copyUltimateSnippet()" class="w-full bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-semibold mb-6">
        📋 Copy Snippet HTML
      </button>

      <!-- BATAS INI - TOMBAOL APK BARU -->
      <div class="mt-6 pt-6 border-t-2 border-dashed border-gray-300 dark:border-slate-600">
        <h3 class="text-lg font-bold mb-2">🤖 Butuh File APK?</h3>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">Klik untuk cetak APK via Microsoft PWABuilder</p>
        <button onclick="buildApk()" id="btnBuildApk" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg">
          🚀 Cetak APK Sekarang
        </button>
      </div>
      <!-- AKHIR TOMBAOL APK -->
    </section>

  </main>

  <!-- Navigation Buttons -->
  <div class="fixed bottom-24 left-0 right-0 bg-white dark:bg-slate-800 border-t p-4">
    <div class="max-w-2xl mx-auto flex gap-3">
      <button id="btnPrev" onclick="changeStep(-1)" class="flex-1 bg-gray-200 dark:bg-slate-700 py-3 rounded-xl font-semibold" disabled>Kembali</button>
      <button id="btnNext" onclick="handleNextButton()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-semibold">Lanjut</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent mx-auto mb-4"></div>
      <p id="loadingText">Memproses...</p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
